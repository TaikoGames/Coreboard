[package]
name = "coreboard"
version = "0.3.3"
edition = "2024"
description = "A reference board for images: drop, arrange, study and export."
authors = ["TaikoGames"]
license = "Proprietary"

[package.metadata.deb]
name = "coreboard"
maintainer = "TaikoGames"
section = "graphics"
extended-description = "Infinite-canvas image reference board with study tools (values, palettes, composition guides), notes, frames, tags and folder watching."
depends = "$auto, libxkbcommon-x11-0"
assets = [
    ["target/release/coreboard", "usr/bin/", "755"],
    ["packaging/coreboard.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/512x512/apps/coreboard.png", "644"],
]

[dependencies]
ab_glyph = "0.2"
arboard = "3.7.0"
directories = "6.0.0"
eframe = "0.37"
epaint_default_fonts = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["platform-verifier"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1"
