[package]
name = "coreboard"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
arboard = "3.7.0"
directories = "6.0.0"
eframe = "0.37"
epaint_default_fonts = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
