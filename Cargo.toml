[package]
name = "coreboard"
version = "0.4.0"
edition = "2024"
description = "A reference board for images: drop, arrange, study and export."
authors = ["TaikoGames"]
license = "Proprietary"

[package.metadata.deb]
name = "coreboard"
maintainer = "TaikoGames"
section = "graphics"
extended-description = "Infinite-canvas image reference board with study tools (values, palettes, composition guides), notes, frames, tags and folder watching."
depends = "$auto, libxkbcommon-x11-0"
assets = [
    ["target/release/coreboard", "usr/bin/", "755"],
    ["packaging/coreboard.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/512x512/apps/coreboard.png", "644"],
]

[dependencies]
ab_glyph = "0.2"
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
eframe = "0.37"
epaint_default_fonts = "0.37"
hayro = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
opener = "0.9.0"
pdf-writer = "0.15.0"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
ureq = { version = "3.5.2", features = ["platform-verifier"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1"

# The floating video player (a web view in its own small window) on Windows and macOS, which
# have a web view built in. On Linux, videos open in the browser instead.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "0.37"
wry = "0.57"
