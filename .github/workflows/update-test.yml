# Manual check of in-app updates on Windows: installs the latest release, then runs an installer
# built from this commit the way Core Board's "Update now" button does (silently, while the old
# version is open), and checks that the files were replaced and Core Board reopened.
name: Test Windows update

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Release to update from"
        default: "v0.3.3"

permissions:
  contents: read

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build this version
        run: cargo build --release --locked
      - name: Build its installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=9.9.9" installer\coreboard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the old release
        shell: pwsh
        run: |
          $tag = "${{ inputs.from }}"
          gh release download $tag -p "CoreBoard-Setup-*.exe" -D old
          $setup = Get-ChildItem old\*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Core Board"
          if (-not (Test-Path "$dir\coreboard.exe")) { throw "old version not installed in $dir" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "no uninstaller next to the app (one-click updates rely on it)" }
          Get-ChildItem $dir | Format-Table Name, Length, LastWriteTime
      - name: Open the old version
        shell: pwsh
        run: |
          Get-Process coreboard -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Core Board\coreboard.exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep 8
          if ($p.HasExited) {
            Write-Host "::warning::The old version exited by itself (exit code $($p.ExitCode)); the runner may have no usable graphics. Testing the install without it running."
          } else {
            Write-Host "Old version running, pid $($p.Id)"
            "OLD_PID=$($p.Id)" >> $env:GITHUB_ENV
          }
      - name: Update the way the app does
        shell: pwsh
        run: |
          # Same arguments as update::run_installer in src/update.rs.
          $setup = (Resolve-Path dist\CoreBoard-Setup-9.9.9.exe).Path
          $started = Get-Date
          $installer = Start-Process $setup -ArgumentList "/SILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          # The app saves and closes itself right after starting the installer.
          Start-Sleep 1
          if ($env:OLD_PID) { Get-Process -Id $env:OLD_PID -ErrorAction SilentlyContinue | ForEach-Object { $_.CloseMainWindow() | Out-Null } }
          $installer.WaitForExit()
          Write-Host "Installer exit code: $($installer.ExitCode)"
          Start-Sleep 8
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Core Board"
          $installed = (Get-FileHash "$dir\coreboard.exe").Hash
          $built = (Get-FileHash target\release\coreboard.exe).Hash
          if ($installed -ne $built) { throw "the installed app wasn't replaced by the new version" }
          Write-Host "Installed app replaced with the new build."
          $version = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
            Where-Object DisplayName -eq "Core Board").DisplayVersion
          Write-Host "Registered version: $version"
          if ($version -ne "9.9.9") { throw "Windows still lists version $version" }
          Get-ChildItem $dir | Format-Table Name, Length, LastWriteTime
          $running = Get-Process coreboard -ErrorAction SilentlyContinue
          $running | Format-Table Id, Path, StartTime
          if ($env:OLD_PID -and ($running | Where-Object Id -eq $env:OLD_PID)) { throw "the old version is still running" }
          $new = $running | Where-Object { $_.StartTime -gt $started }
          if (-not $new) {
            Write-Host "::warning::Core Board didn't reopen after the update (or exited at once, e.g. no graphics on the runner)."
          } else {
            Write-Host "Core Board reopened after the update (pid $($new.Id))."
          }
          Get-Process coreboard -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Update while Core Board stays open
        shell: pwsh
        run: |
          # Even if the old copy doesn't close in time, the update must go through.
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Core Board\coreboard.exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep 6
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=9.9.10" installer\coreboard.iss | Out-Null
          if ($p.HasExited) { Write-Host "::warning::Core Board exited by itself; this step can't test an open copy." }
          $before = Get-Date
          # Wait for the installer only: -Wait would also wait for the Core Board it reopens.
          $installer = Start-Process dist\CoreBoard-Setup-9.9.10.exe -ArgumentList "/SILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          $installer.WaitForExit()
          Write-Host "Installer exit code: $($installer.ExitCode)"
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Core Board"
          Get-ChildItem $dir | Format-Table Name, Length, LastWriteTime
          $version = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
            Where-Object DisplayName -eq "Core Board").DisplayVersion
          if ($version -ne "9.9.10") { throw "Windows still lists version $version" }
          if ((Get-Item "$dir\coreboard.exe").LastWriteTime -lt $before.AddSeconds(-5) -and (Get-Item "$dir\coreboard.exe").CreationTime -lt $before) { throw "app not replaced" }
          if (-not $p.HasExited -and -not (Get-ChildItem "$dir\coreboard.old*.exe")) { throw "the open copy wasn't moved aside" }
          Write-Host "Updated to 9.9.10 with the old copy still open."
          Get-Process coreboard -ErrorAction SilentlyContinue | Stop-Process -Force
