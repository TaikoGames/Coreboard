# Manual check of YouTube video cards: fetches a video's title and thumbnail, then opens the
# floating player on Windows and macOS and checks the video page loads in it.
name: Test video player

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Video title and thumbnail (online)
        run: cargo test --locked -- --ignored fetches_a_youtube_title_and_thumbnail
      - name: Build
        run: cargo build --release --locked
      - name: Open the player
        shell: bash
        run: |
          export COREBOARD_PLAYER_LOG="$PWD/player.log"
          EXE=target/release/coreboard
          [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          "$EXE" --play-video "https://www.youtube.com/watch?v=jNQXAC9IVRw" "Me at the zoo" &
          PID=$!
          for i in $(seq 1 45); do
            grep -q "^loaded .*youtube" player.log 2>/dev/null && break
            sleep 1
          done
          echo "--- player log"; cat player.log || true
          if ! kill -0 $PID 2>/dev/null; then echo "::error::the player closed by itself"; exit 1; fi
          kill $PID || true
          grep -q "^player opened" player.log || { echo "::error::no player window"; exit 1; }
          grep -q "^loaded .*youtube" player.log || { echo "::error::the video page didn't load"; exit 1; }
          echo "The player opened and loaded the video page."
