# Builds ready-to-install Core Board downloads for Windows, macOS and Linux, and publishes each
# version as a GitHub Release (tag v<version>, with every platform's files).
#
# - Pushing to main publishes automatically when Cargo.toml's version has no release yet, so
#   bumping the version is all it takes to ship one. Other pushes to main build nothing.
# - Run it by hand (Actions tab → "Build installers" → Run workflow) to just build (files under
#   the run's Artifacts), or with "publish" to release; "commit" builds an older commit, e.g. to
#   add a past version to the releases.
# - Pushing a v* tag builds and releases that tag.

name: Build installers

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish as a release (v<version from Cargo.toml>)
        type: boolean
        default: false
      commit:
        description: Commit to build (empty = the branch you run it on)
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides what this run does: which commit and version, and whether to build and release.
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          TAG="v$VERSION"
          RELEASED=false
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null && RELEASED=true
          case "$EVENT" in
            workflow_dispatch) BUILD=true; PUBLISH=$PUBLISH_INPUT ;;
            push)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
                  echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $VERSION"
                  exit 1
                fi
                BUILD=true; PUBLISH=true
              elif [ "$RELEASED" = false ]; then
                BUILD=true; PUBLISH=true
              else
                BUILD=false; PUBLISH=false
              fi ;;
          esac
          # Mark it "latest" only if no newer version has been released.
          NEWEST=$( (git ls-remote --tags origin 'refs/tags/v*' | sed -n 's#.*refs/tags/v\([0-9.]*\)$#\1#p'; echo "$VERSION") | sort -V | tail -1)
          LATEST=false
          [ "$NEWEST" = "$VERSION" ] && LATEST=true
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "publish=$PUBLISH"
            echo "latest=$LATEST"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION · build: $BUILD · publish: $PUBLISH · latest: $LATEST"

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" installer\coreboard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target\release\coreboard.exe -DestinationPath "dist\CoreBoard-${{ steps.version.outputs.value }}-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build (Apple Silicon and Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: App bundle and disk image
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          APP="dmg/Core Board.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          lipo -create \
            target/aarch64-apple-darwin/release/coreboard \
            target/x86_64-apple-darwin/release/coreboard \
            -output "$APP/Contents/MacOS/coreboard"

          ICONSET=AppIcon.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icon.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            if [ $double -le 512 ]; then
              sips -z $double $double assets/icon.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
            fi
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Core Board</string>
            <key>CFBundleDisplayName</key><string>Core Board</string>
            <key>CFBundleIdentifier</key><string>com.taikogames.coreboard</string>
            <key>CFBundleExecutable</key><string>coreboard</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Ad-hoc signature so Apple Silicon will run it (no paid developer certificate).
          codesign --force --deep --sign - "$APP"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Core Board" -srcfolder dmg -ov -format UDZO \
            "dist/CoreBoard-${VERSION}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # The oldest supported Ubuntu, so the binary also runs on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build
        run: cargo build --release --locked
      - name: Packages
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          cargo deb --no-build --output "dist/coreboard_${VERSION}_amd64.deb"
          DIR="CoreBoard-${VERSION}-linux"
          mkdir -p "$DIR"
          cp target/release/coreboard assets/icon.png packaging/coreboard.desktop "$DIR/"
          tar -czf "dist/${DIR}.tar.gz" "$DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  release:
    needs: [plan, windows, macos, linux]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          name: Core Board ${{ needs.plan.outputs.version }}
          make_latest: ${{ needs.plan.outputs.latest }}
          files: dist/*
          # "What's new" from the commits since the previous version, after the install steps.
          generate_release_notes: true
          body: |
            ## Download

            - **Windows:** `CoreBoard-Setup-….exe`. Double-click it, then **Install**. Core Board opens when it's done.
              If Windows shows "Windows protected your PC", click **More info → Run anyway** (the installer isn't code-signed yet).
              No-install option: the `windows-portable.zip`; unzip it and double-click `coreboard.exe`.
            - **macOS:** `CoreBoard-….dmg`. Open it, drag **Core Board** onto **Applications**.
              The first time, right-click the app → **Open** (or System Settings → Privacy & Security → **Open Anyway**), since it isn't notarized yet.
            - **Linux:** the `.deb` (Ubuntu/Debian: double-click, or `sudo apt install ./coreboard_….deb`), or the `.tar.gz` with a standalone binary.
