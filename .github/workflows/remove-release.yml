# Removes a published release and its tag, e.g. to renumber a version.
# Run by hand: Actions tab → "Remove a release" → Run workflow, with the tag (e.g. v0.4.0).

name: Remove a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to remove, e.g. v0.4.0
        required: true

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
